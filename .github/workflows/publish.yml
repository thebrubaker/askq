name: publish

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack and verify only; do not publish"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@latest && npm --version

      - run: bun install --frozen-lockfile

      - run: bun run check

      - run: bun run build

      - name: Run the packed tarball under plain Node
        run: |
          npm pack
          mkdir -p "$RUNNER_TEMP/smoke"
          cd "$RUNNER_TEMP/smoke"
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/askq-*.tgz
          npx --no-install askq --help >/dev/null

      - name: Refuse to republish an existing version
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "askq@${version}" version >/dev/null 2>&1; then
            echo "askq@${version} is already on npm" >&2
            exit 1
          fi

      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
